<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <rect width="400" height="220" fill="#f8f9fb" />

  <!-- Subtle architectural ledger grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="44" x2="400" y2="44" />
    <line x1="0" y1="88" x2="400" y2="88" />
    <line x1="0" y1="132" x2="400" y2="132" />
    <line x1="0" y1="176" x2="400" y2="176" />
    <line x1="80" y1="0" x2="80" y2="220" />
    <line x1="160" y1="0" x2="160" y2="220" />
    <line x1="240" y1="0" x2="240" y2="220" />
    <line x1="320" y1="0" x2="320" y2="220" />
  </g>

  <!-- Broken #REF! cell on left -->
  <g>
    <rect x="44" y="82" width="84" height="36" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="86" y="104" text-anchor="middle" fill="#dc2626" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">#REF!</text>
  </g>

  <!-- Transition arrow -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="138" y1="100" x2="166" y2="100" />
    <path d="M161 95 L167 100 L161 105" fill="none" />
  </g>

  <!-- Magnifying lens inspecting & fixing formula -->
  <g>
    <!-- Lens handle -->
    <line x1="283" y1="139" x2="324" y2="180" stroke="#1a2744" stroke-width="4" stroke-linecap="round" />
    <line x1="283" y1="139" x2="324" y2="180" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

    <!-- Lens outer frame -->
    <circle cx="240" cy="100" r="60" fill="#ffffff" stroke="#1a2744" stroke-width="1.5" />
    <circle cx="240" cy="100" r="53" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

    <!-- Mini spreadsheet grid inside lens -->
    <line x1="194" y1="84" x2="286" y2="84" stroke="#e2e8f0" stroke-width="1" />
    <line x1="194" y1="116" x2="286" y2="116" stroke="#e2e8f0" stroke-width="1" />
    <line x1="222" y1="54" x2="222" y2="146" stroke="#e2e8f0" stroke-width="1" />

    <!-- Active fixed formula cell -->
    <rect x="196" y="84" width="88" height="32" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" />
    <text x="240" y="104" text-anchor="middle" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600">=XLOOKUP(...)</text>

    <!-- Active-cell fill handle -->
    <rect x="281.5" y="113.5" width="5" height="5" fill="#15803d" stroke="#ffffff" stroke-width="1" />
  </g>
</svg>
