<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <rect width="400" height="220" fill="#f8f9fb" />

  <!-- Subtle architectural ledger grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="44" x2="400" y2="44" />
    <line x1="0" y1="88" x2="400" y2="88" />
    <line x1="0" y1="132" x2="400" y2="132" />
    <line x1="0" y1="176" x2="400" y2="176" />
    <line x1="80" y1="0" x2="80" y2="220" />
    <line x1="160" y1="0" x2="160" y2="220" />
    <line x1="240" y1="0" x2="240" y2="220" />
    <line x1="320" y1="0" x2="320" y2="220" />
  </g>

  <!-- Main Dashboard Card -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="52" y="34" width="296" height="152" rx="8" fill="#ffffff" />
    <!-- Top bar -->
    <line x1="52" y1="62" x2="348" y2="62" stroke="#cbd5e1" stroke-width="1" />
    <text x="68" y="52" fill="#1a2744" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600">MODEL_FINAL.xlsx</text>

    <!-- Left: Polished Table -->
    <rect x="68" y="76" width="144" height="94" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <line x1="68" y1="99" x2="212" y2="99" stroke="#cbd5e1" stroke-width="1" />
    <line x1="68" y1="122" x2="212" y2="122" stroke="#cbd5e1" stroke-width="1" />
    <line x1="68" y1="145" x2="212" y2="145" stroke="#cbd5e1" stroke-width="1" />
    <line x1="150" y1="76" x2="150" y2="170" stroke="#cbd5e1" stroke-width="1" />

    <!-- Table bar lines -->
    <line x1="78" y1="88" x2="128" y2="88" stroke="#64748b" stroke-width="2" />
    <line x1="160" y1="88" x2="200" y2="88" stroke="#15803d" stroke-width="2" />
    <line x1="78" y1="111" x2="136" y2="111" stroke="#94a3b8" stroke-width="2" />
    <line x1="160" y1="111" x2="196" y2="111" stroke="#1a2744" stroke-width="2" />
    <line x1="78" y1="134" x2="122" y2="134" stroke="#94a3b8" stroke-width="2" />
    <line x1="160" y1="134" x2="202" y2="134" stroke="#15803d" stroke-width="2" />
    <line x1="78" y1="157" x2="130" y2="157" stroke="#94a3b8" stroke-width="2" />
    <line x1="160" y1="157" x2="198" y2="157" stroke="#1a2744" stroke-width="2" />

    <!-- Right: Upward Trend Bars -->
    <rect x="226" y="76" width="106" height="94" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <line x1="238" y1="154" x2="320" y2="154" stroke="#cbd5e1" stroke-width="1" />
    <rect x="242" y="132" width="14" height="22" rx="2" fill="#bbf7d0" stroke="#15803d" stroke-width="1.25" />
    <rect x="262" y="118" width="14" height="36" rx="2" fill="#86efac" stroke="#15803d" stroke-width="1.25" />
    <rect x="282" y="102" width="14" height="52" rx="2" fill="#4ade80" stroke="#15803d" stroke-width="1.25" />
    <rect x="302" y="88" width="14" height="66" rx="2" fill="#15803d" stroke="#15803d" stroke-width="1.25" />
  </g>

  <!-- Locked / Verified Formula Badge -->
  <g>
    <circle cx="344" cy="38" r="16" fill="#15803d" stroke="#f8f9fb" stroke-width="3" />
    <!-- Padlock icon inside badge -->
    <rect x="338" y="37" width="12" height="9" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <path d="M340.5 37 V34.5 C340.5 32.567 342.067 31 344 31 C345.933 31 347.5 32.567 347.5 34.5 V37" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
