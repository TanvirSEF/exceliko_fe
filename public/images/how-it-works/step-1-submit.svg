<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <rect width="400" height="220" fill="#f8f9fb" />

  <!-- Subtle architectural ledger grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="44" x2="400" y2="44" />
    <line x1="0" y1="88" x2="400" y2="88" />
    <line x1="0" y1="132" x2="400" y2="132" />
    <line x1="0" y1="176" x2="400" y2="176" />
    <line x1="80" y1="0" x2="80" y2="220" />
    <line x1="160" y1="0" x2="160" y2="220" />
    <line x1="240" y1="0" x2="240" y2="220" />
    <line x1="320" y1="0" x2="320" y2="220" />
  </g>

  <!-- Spreadsheet document sliding into inbox -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sheet body -->
    <rect x="128" y="28" width="144" height="106" rx="6" fill="#ffffff" />
    <!-- Sheet header band -->
    <path d="M128 50 H272" stroke="#cbd5e1" stroke-width="1" />
    <rect x="138" y="35" width="38" height="10" rx="2" fill="#15803d" stroke="none" />
    <text x="157" y="42.5" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="600">.xlsx</text>
    <rect x="182" y="35" width="34" height="10" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="199" y="42.5" text-anchor="middle" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="600">.csv</text>

    <!-- Spreadsheet cell grid inside sheet -->
    <rect x="140" y="60" width="120" height="58" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <line x1="140" y1="79" x2="260" y2="79" stroke="#cbd5e1" stroke-width="1" />
    <line x1="140" y1="98" x2="260" y2="98" stroke="#cbd5e1" stroke-width="1" />
    <line x1="180" y1="60" x2="180" y2="118" stroke="#cbd5e1" stroke-width="1" />
    <line x1="220" y1="60" x2="220" y2="118" stroke="#cbd5e1" stroke-width="1" />

    <!-- Active green cell highlight -->
    <rect x="180" y="79" width="40" height="19" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" />
    <rect x="217.5" y="95.5" width="4.5" height="4.5" fill="#15803d" stroke="#ffffff" stroke-width="0.75" />

    <!-- Inbox slot base -->
    <path d="M96 136 H124 L136 154 H264 L276 136 H304 V182 C304 186.418 300.418 190 296 190 H104 C99.582 190 96 186.418 96 182 V136 Z" fill="#ffffff" />
    <path d="M96 136 H124 L136 154 H264 L276 136 H304" />
    <line x1="140" y1="172" x2="260" y2="172" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Slide-in guide ticks -->
  <g stroke="#15803d" stroke-width="1.5" stroke-linecap="round">
    <line x1="200" y1="14" x2="200" y2="22" />
    <path d="M196 19 L200 23 L204 19" fill="none" />
  </g>

  <!-- Green checkmark badge -->
  <g>
    <circle cx="282" cy="134" r="16" fill="#15803d" stroke="#f8f9fb" stroke-width="3" />
    <path d="M275.5 134.5 L280 139 L289 129.5" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
