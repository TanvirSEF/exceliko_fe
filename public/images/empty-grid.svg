<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" fill="none">
  <rect width="260" height="140" fill="#f8f9fb" />

  <!-- Subtle background ledger lines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="35" x2="260" y2="35" />
    <line x1="0" y1="70" x2="260" y2="70" />
    <line x1="0" y1="105" x2="260" y2="105" />
    <line x1="65" y1="0" x2="65" y2="140" />
    <line x1="130" y1="0" x2="130" y2="140" />
    <line x1="195" y1="0" x2="195" y2="140" />
  </g>

  <!-- Spreadsheet A1:D4 Range Frame -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="34" y="18" width="192" height="104" rx="4" fill="#ffffff" />

    <!-- Header Row & Row Index Column -->
    <line x1="34" y1="38" x2="226" y2="38" stroke="#cbd5e1" stroke-width="1" />
    <line x1="58" y1="18" x2="58" y2="122" stroke="#cbd5e1" stroke-width="1" />

    <!-- Column Labels A B C D -->
    <g fill="#64748b" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="600" text-anchor="middle">
      <text x="79" y="31">A</text>
      <text x="121" y="31">B</text>
      <text x="163" y="31">C</text>
      <text x="205" y="31">D</text>
      <text x="46" y="51">1</text>
      <text x="46" y="72">2</text>
      <text x="46" y="93">3</text>
      <text x="46" y="114">4</text>
    </g>

    <!-- Inner Empty Cell Grid -->
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="100" y1="38" x2="100" y2="122" />
      <line x1="142" y1="38" x2="142" y2="122" />
      <line x1="184" y1="38" x2="184" y2="122" />
      <line x1="58" y1="59" x2="226" y2="59" />
      <line x1="58" y1="80" x2="226" y2="80" />
      <line x1="58" y1="101" x2="226" y2="101" />
    </g>

    <!-- Forest-Green Selection Box A1:D4 -->
    <rect x="58" y="38" width="168" height="84" fill="#dcfce7" fill-opacity="0.28" stroke="#15803d" stroke-width="1.5" />
    <rect x="223.5" y="119.5" width="5" height="5" fill="#15803d" stroke="#ffffff" stroke-width="0.75" />
  </g>

  <!-- A1:D4 Tag -->
  <rect x="34" y="18" width="24" height="20" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="46" y="31" text-anchor="middle" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700">A1:D4</text>

  <!-- Subtle Magnifying Glass Icon -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round">
    <circle cx="138" cy="76" r="14" fill="#ffffff" />
    <line x1="148.5" y1="86.5" x2="158" y2="96" stroke-width="2" />
    <line x1="133" y1="76" x2="143" y2="76" stroke="#15803d" />
  </g>
</svg>
