<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
  <rect width="560" height="400" fill="#f8f9fb" />

  <!-- Subtle 1px architectural spreadsheet grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="50" x2="560" y2="50" />
    <line x1="0" y1="100" x2="560" y2="100" />
    <line x1="0" y1="150" x2="560" y2="150" />
    <line x1="0" y1="200" x2="560" y2="200" />
    <line x1="0" y1="250" x2="560" y2="250" />
    <line x1="0" y1="300" x2="560" y2="300" />
    <line x1="0" y1="350" x2="560" y2="350" />
    <line x1="70" y1="0" x2="70" y2="400" />
    <line x1="140" y1="0" x2="140" y2="400" />
    <line x1="210" y1="0" x2="210" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="420" y1="0" x2="420" y2="400" />
    <line x1="490" y1="0" x2="490" y2="400" />
  </g>

  <!-- Tab 1: Inputs (Top-Left) -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="34" y="34" width="176" height="122" rx="6" fill="#ffffff" />
    <line x1="34" y1="62" x2="210" y2="62" stroke="#cbd5e1" stroke-width="1" />
    <rect x="44" y="42" width="60" height="14" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="74" y="52" text-anchor="middle" fill="#1a2744" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="600">01 Inputs</text>

    <!-- Input Grid -->
    <rect x="46" y="74" width="152" height="68" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <line x1="46" y1="96" x2="198" y2="96" stroke="#cbd5e1" stroke-width="1" />
    <line x1="46" y1="119" x2="198" y2="119" stroke="#cbd5e1" stroke-width="1" />
    <line x1="122" y1="74" x2="122" y2="142" stroke="#cbd5e1" stroke-width="1" />
    <rect x="122" y="96" width="76" height="23" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" />
    <rect x="195.5" y="116.5" width="4.5" height="4.5" fill="#15803d" stroke="#ffffff" stroke-width="0.75" />
    <line x1="56" y1="85" x2="108" y2="85" stroke="#64748b" />
    <line x1="56" y1="108" x2="100" y2="108" stroke="#64748b" />
    <line x1="56" y1="131" x2="110" y2="131" stroke="#64748b" />
  </g>

  <!-- Arrow 1: Inputs -> Calculations -->
  <g stroke="#15803d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 96 H244 V148" fill="none" />
    <path d="M239 142 L244 149 L249 142" fill="none" />
  </g>

  <!-- Tab 2: Calculations (Center) -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="176" y="152" width="198" height="122" rx="6" fill="#ffffff" />
    <line x1="176" y1="180" x2="374" y2="180" stroke="#cbd5e1" stroke-width="1" />
    <rect x="186" y="160" width="92" height="14" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1" />
    <text x="232" y="170" text-anchor="middle" fill="#15803d" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="600">02 Calculations</text>
    <text x="358" y="170" text-anchor="end" fill="#15803d" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">fx</text>

    <!-- Formula Rows -->
    <rect x="188" y="192" width="174" height="20" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="196" y="205" fill="#1a2744" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="600">=SUMIFS(Rev, Dept, A2)</text>

    <rect x="188" y="218" width="174" height="20" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.25" />
    <text x="196" y="231" fill="#15803d" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="600">=NPV($B$2, C4:G4)</text>

    <rect x="188" y="244" width="174" height="20" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="196" y="257" fill="#64748b" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="600">=IRR(C4:G4)</text>
  </g>

  <!-- Arrow 2: Calculations -> Executive Summary -->
  <g stroke="#15803d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M374 214 H414 V246" fill="none" />
    <path d="M409 240 L414 247 L419 240" fill="none" />
  </g>

  <!-- Tab 3: Executive Summary (Bottom-Right) -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="330" y="250" width="196" height="122" rx="6" fill="#ffffff" />
    <line x1="330" y1="278" x2="526" y2="278" stroke="#cbd5e1" stroke-width="1" />
    <rect x="340" y="258" width="116" height="14" rx="3" fill="#1a2744" stroke="none" />
    <text x="398" y="268" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="600">03 Exec Summary</text>

    <!-- KPI Table + Mini Bars -->
    <rect x="342" y="290" width="90" height="68" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <line x1="342" y1="312" x2="432" y2="312" stroke="#cbd5e1" stroke-width="1" />
    <line x1="342" y1="335" x2="432" y2="335" stroke="#cbd5e1" stroke-width="1" />
    <line x1="352" y1="301" x2="416" y2="301" stroke="#15803d" stroke-width="2" />
    <line x1="352" y1="324" x2="404" y2="324" stroke="#64748b" stroke-width="2" />
    <line x1="352" y1="347" x2="418" y2="347" stroke="#1a2744" stroke-width="2" />

    <!-- Summary Bars -->
    <rect x="444" y="290" width="70" height="68" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="453" y="330" width="12" height="20" rx="1.5" fill="#bbf7d0" stroke="#15803d" stroke-width="1.25" />
    <rect x="472" y="316" width="12" height="34" rx="1.5" fill="#4ade80" stroke="#15803d" stroke-width="1.25" />
    <rect x="491" y="302" width="12" height="48" rx="1.5" fill="#15803d" stroke="#15803d" stroke-width="1.25" />
  </g>

  <!-- Verified Badge on Summary -->
  <g>
    <circle cx="520" cy="254" r="13" fill="#15803d" stroke="#f8f9fb" stroke-width="3" />
    <path d="M514.5 254.5 L518.5 258.5 L525.5 250.5" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
