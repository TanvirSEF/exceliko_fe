<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
  <rect width="560" height="400" fill="#f8f9fb" />

  <!-- Subtle 1px architectural spreadsheet grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="50" x2="560" y2="50" />
    <line x1="0" y1="100" x2="560" y2="100" />
    <line x1="0" y1="150" x2="560" y2="150" />
    <line x1="0" y1="200" x2="560" y2="200" />
    <line x1="0" y1="250" x2="560" y2="250" />
    <line x1="0" y1="300" x2="560" y2="300" />
    <line x1="0" y1="350" x2="560" y2="350" />
    <line x1="70" y1="0" x2="70" y2="400" />
    <line x1="140" y1="0" x2="140" y2="400" />
    <line x1="210" y1="0" x2="210" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="420" y1="0" x2="420" y2="400" />
    <line x1="490" y1="0" x2="490" y2="400" />
  </g>

  <!-- Stage 1: Raw CSV Data Table (Left) -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="28" y="104" width="144" height="192" rx="6" fill="#ffffff" />
    <line x1="28" y1="134" x2="172" y2="134" stroke="#cbd5e1" stroke-width="1" />
    <text x="40" y="123" fill="#1a2744" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600">raw_data.csv</text>

    <!-- CSV Grid -->
    <rect x="40" y="146" width="120" height="136" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <line x1="40" y1="173" x2="160" y2="173" stroke="#cbd5e1" stroke-width="1" />
    <line x1="40" y1="200" x2="160" y2="200" stroke="#cbd5e1" stroke-width="1" />
    <line x1="40" y1="227" x2="160" y2="227" stroke="#cbd5e1" stroke-width="1" />
    <line x1="40" y1="254" x2="160" y2="254" stroke="#cbd5e1" stroke-width="1" />
    <line x1="80" y1="146" x2="80" y2="282" stroke="#cbd5e1" stroke-width="1" />
    <line x1="120" y1="146" x2="120" y2="282" stroke="#cbd5e1" stroke-width="1" />

    <!-- Raw lines -->
    <line x1="48" y1="160" x2="72" y2="160" stroke="#64748b" />
    <line x1="88" y1="160" x2="112" y2="160" stroke="#64748b" />
    <line x1="128" y1="160" x2="152" y2="160" stroke="#64748b" />
    <line x1="48" y1="187" x2="70" y2="187" stroke="#94a3b8" />
    <line x1="88" y1="187" x2="110" y2="187" stroke="#94a3b8" />
    <line x1="128" y1="187" x2="148" y2="187" stroke="#94a3b8" />
    <line x1="48" y1="214" x2="72" y2="214" stroke="#94a3b8" />
    <line x1="88" y1="214" x2="112" y2="214" stroke="#94a3b8" />
    <line x1="128" y1="214" x2="150" y2="214" stroke="#94a3b8" />
    <line x1="48" y1="241" x2="68" y2="241" stroke="#94a3b8" />
    <line x1="88" y1="241" x2="108" y2="241" stroke="#94a3b8" />
    <line x1="128" y1="241" x2="148" y2="241" stroke="#94a3b8" />
  </g>

  <!-- Arrow 1: CSV -> Engine -->
  <g stroke="#15803d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="176" y1="200" x2="214" y2="200" />
    <path d="M208 195 L215 200 L208 205" fill="none" />
  </g>

  <!-- Stage 2: Apps Script / Macro Gear-and-Formula Engine (Center) -->
  <g>
    <rect x="220" y="132" width="120" height="136" rx="8" fill="#ffffff" stroke="#1a2744" stroke-width="1.5" />
    <text x="280" y="152" text-anchor="middle" fill="#1a2744" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="600">SCRIPT ENGINE</text>

    <!-- Crisp Gear Ring -->
    <g transform="translate(280, 202)" stroke="#1a2744" stroke-width="1.5" stroke-linejoin="round">
      <path
        d="M-6 -32 H6 L8 -24 L15 -21 L22 -26 L29 -19 L24 -12 L27 -5 L35 -3 V9 L27 11 L24 18 L29 25 L22 32 L15 27 L8 30 L6 38 H-6 L-8 30 L-15 27 L-22 32 L-29 25 L-24 18 L-27 11 L-35 9 V-3 L-27 -5 L-24 -12 L-29 -19 L-22 -26 L-15 -21 L-8 -24 Z"
        fill="#f8fafc"
      />
      <circle cx="0" cy="3" r="18" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" />
      <text x="0" y="7" text-anchor="middle" fill="#15803d" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">fx</text>
    </g>

    <text x="280" y="258" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600">VBA · Apps Script</text>
  </g>

  <!-- Arrow 2: Engine -> Report -->
  <g stroke="#15803d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="344" y1="200" x2="382" y2="200" />
    <path d="M376 195 L383 200 L376 205" fill="none" />
  </g>

  <!-- Stage 3: Automated Report Output (Right) -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="388" y="94" width="144" height="212" rx="6" fill="#ffffff" />
    <line x1="388" y1="124" x2="532" y2="124" stroke="#cbd5e1" stroke-width="1" />
    <text x="400" y="113" fill="#1a2744" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600">Report.xlsx</text>

    <!-- Highlighted KPI Summary Cell -->
    <rect x="400" y="136" width="120" height="34" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" />
    <text x="410" y="150" fill="#15803d" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600">AUTO SYNCED</text>
    <text x="410" y="163" fill="#1a2744" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">$148,920</text>
    <rect x="517.5" y="167.5" width="4.5" height="4.5" fill="#15803d" stroke="#ffffff" stroke-width="0.75" />

    <!-- Mini Report Chart -->
    <rect x="400" y="182" width="120" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="414" y="214" width="16" height="18" rx="1.5" fill="#bbf7d0" stroke="#15803d" stroke-width="1.25" />
    <rect x="438" y="204" width="16" height="28" rx="1.5" fill="#86efac" stroke="#15803d" stroke-width="1.25" />
    <rect x="462" y="196" width="16" height="36" rx="1.5" fill="#4ade80" stroke="#15803d" stroke-width="1.25" />
    <rect x="486" y="190" width="16" height="42" rx="1.5" fill="#15803d" stroke="#15803d" stroke-width="1.25" />

    <!-- Report Summary Lines -->
    <rect x="400" y="250" width="120" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <line x1="410" y1="264" x2="480" y2="264" stroke="#64748b" />
    <line x1="490" y1="264" x2="510" y2="264" stroke="#15803d" />
    <line x1="410" y1="280" x2="468" y2="280" stroke="#94a3b8" />
    <line x1="490" y1="280" x2="510" y2="280" stroke="#1a2744" />
  </g>

  <!-- Verified Output Checkmark -->
  <g>
    <circle cx="526" cy="98" r="14" fill="#15803d" stroke="#f8f9fb" stroke-width="3" />
    <path d="M520.5 98.5 L524.5 102.5 L532 94.5" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
