  <rect x="34" y="47" width="12" height="12" rx="4" fill="#9a6445" stroke="#1a2744" stroke-width="1.5" />
  <!-- Head -->
  <path d="M25 32 C25 20, 55 20, 55 32 V39 C55 48, 48 53, 40 53 C32 53, 25 48, 25 39 Z" fill="#ab714f" stroke="#1a2744" stroke-width="1.5" />
  <!-- Short Fade Hair -->
  <path d="M25 31 C25 19, 32 15, 40 15 C48 15, 55 19, 55 31 C52 25, 46 23, 40 23 C34 23, 28 25, 25 31 Z" fill="#1a2744" />
