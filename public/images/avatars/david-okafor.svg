  <circle cx="46" cy="36" r="1.25" fill="#1a2744" />
  <path d="M36 44 C38.5 45.8, 41.5 45.8, 44 44" stroke="#f8f9fb" stroke-width="1.4" stroke-linecap="round" />
</svg>
