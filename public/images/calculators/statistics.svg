<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <rect width="400" height="200" fill="#f8f9fb" />

  <!-- Subtle 1px spreadsheet gridlines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="80" y1="0" x2="80" y2="200" />
    <line x1="160" y1="0" x2="160" y2="200" />
    <line x1="240" y1="0" x2="240" y2="200" />
    <line x1="320" y1="0" x2="320" y2="200" />
  </g>

  <!-- Shaded +/- 1 sigma region under curve -->
  <path
    d="M150 156 L150 72 C168 48, 184 36, 200 36 C216 36, 232 48, 250 72 L250 156 Z"
    fill="#dcfce7"
  />

  <!-- Standard deviation vertical marker lines -->
  <g stroke="#15803d" stroke-width="1.25" stroke-dasharray="3 3">
    <line x1="150" y1="72" x2="150" y2="156" />
    <line x1="250" y1="72" x2="250" y2="156" />
  </g>
  <line x1="200" y1="36" x2="200" y2="156" stroke="#15803d" stroke-width="1.5" />

  <!-- Normal Distribution Bell Curve -->
  <path
    d="M44 156 C86 156, 108 144, 128 112 C148 80, 170 36, 200 36 C230 36, 252 80, 272 112 C292 144, 314 156, 356 156"
    fill="none"
    stroke="#1a2744"
    stroke-width="1.75"
    stroke-linecap="round"
  />

  <!-- Baseline axis & sigma ticks -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round">
    <line x1="40" y1="156" x2="360" y2="156" />
    <line x1="100" y1="153" x2="100" y2="159" />
    <line x1="150" y1="153" x2="150" y2="159" />
    <line x1="200" y1="153" x2="200" y2="159" />
    <line x1="250" y1="153" x2="250" y2="159" />
    <line x1="300" y1="153" x2="300" y2="159" />
  </g>

  <!-- Mean peak node -->
  <circle cx="200" cy="36" r="4" fill="#15803d" stroke="#ffffff" stroke-width="1.5" />

  <!-- Sigma labels -->
  <g fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600" text-anchor="middle">
    <text x="100" y="174">-2σ</text>
    <text x="150" y="174">-1σ</text>
    <text x="200" y="174" fill="#15803d">μ</text>
    <text x="250" y="174">+1σ</text>
    <text x="300" y="174">+2σ</text>
  </g>
</svg>
