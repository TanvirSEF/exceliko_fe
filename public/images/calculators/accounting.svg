<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <rect width="400" height="200" fill="#f8f9fb" />

  <!-- Subtle 1px spreadsheet gridlines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="80" y1="0" x2="80" y2="200" />
    <line x1="160" y1="0" x2="160" y2="200" />
    <line x1="240" y1="0" x2="240" y2="200" />
    <line x1="320" y1="0" x2="320" y2="200" />
  </g>

  <!-- T-Account Ledger Sheet -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="76" y="24" width="248" height="152" rx="6" fill="#ffffff" />

    <!-- T-Account Header & Vertical Center Rule -->
    <line x1="92" y1="56" x2="308" y2="56" />
    <line x1="200" y1="56" x2="200" y2="162" />

    <text x="146" y="45" text-anchor="middle" fill="#1a2744" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">DEBIT (DR)</text>
    <text x="254" y="45" text-anchor="middle" fill="#1a2744" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">CREDIT (CR)</text>

    <!-- Debit Rows -->
    <line x1="100" y1="74" x2="150" y2="74" stroke="#94a3b8" />
    <line x1="164" y1="74" x2="188" y2="74" />
    <line x1="100" y1="94" x2="142" y2="94" stroke="#94a3b8" />
    <line x1="164" y1="94" x2="188" y2="94" />
    <line x1="100" y1="114" x2="154" y2="114" stroke="#94a3b8" />
    <line x1="164" y1="114" x2="188" y2="114" />

    <!-- Credit Rows -->
    <line x1="212" y1="74" x2="262" y2="74" stroke="#94a3b8" />
    <line x1="276" y1="74" x2="300" y2="74" />
    <line x1="212" y1="94" x2="256" y2="94" stroke="#94a3b8" />
    <line x1="276" y1="94" x2="300" y2="94" />
    <line x1="212" y1="114" x2="264" y2="114" stroke="#94a3b8" />
    <line x1="276" y1="114" x2="300" y2="114" />

    <!-- Balanced Totals & Double Accounting Underline -->
    <line x1="100" y1="134" x2="188" y2="134" stroke="#cbd5e1" stroke-width="1" />
    <line x1="212" y1="134" x2="300" y2="134" stroke="#cbd5e1" stroke-width="1" />
    <rect x="156" y="140" width="36" height="14" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1.25" />
    <rect x="268" y="140" width="36" height="14" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1.25" />
    <line x1="156" y1="158" x2="192" y2="158" stroke="#15803d" stroke-width="1.25" />
    <line x1="268" y1="158" x2="304" y2="158" stroke="#15803d" stroke-width="1.25" />
  </g>

  <!-- Green Reconciliation Check Badge -->
  <g>
    <circle cx="322" cy="28" r="14" fill="#15803d" stroke="#f8f9fb" stroke-width="3" />
    <path d="M316.5 28.5 L320.5 32.5 L328 24.5" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
