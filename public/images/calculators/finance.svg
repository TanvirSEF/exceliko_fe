<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <rect width="400" height="200" fill="#f8f9fb" />

  <!-- Subtle 1px spreadsheet gridlines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="80" y1="0" x2="80" y2="200" />
    <line x1="160" y1="0" x2="160" y2="200" />
    <line x1="240" y1="0" x2="240" y2="200" />
    <line x1="320" y1="0" x2="320" y2="200" />
  </g>

  <!-- Chart frame & axes -->
  <g stroke="#1a2744" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="56" y1="162" x2="344" y2="162" />
    <line x1="56" y1="36" x2="56" y2="162" />

    <!-- Compounding cash-flow bars -->
    <rect x="78" y="132" width="32" height="30" rx="2" fill="#ffffff" />
    <rect x="130" y="114" width="32" height="48" rx="2" fill="#ffffff" />
    <rect x="182" y="92" width="32" height="70" rx="2" fill="#ffffff" />
    <rect x="234" y="68" width="32" height="94" rx="2" fill="#ffffff" />
    <rect x="286" y="46" width="32" height="116" rx="2" fill="#dcfce7" stroke="#15803d" />
  </g>

  <!-- IRR / NPV Curve Line -->
  <path
    d="M78 134 C128 128, 176 106, 224 78 C258 58, 286 44, 318 36"
    fill="none"
    stroke="#15803d"
    stroke-width="1.75"
    stroke-linecap="round"
  />

  <!-- Curve data nodes -->
  <circle cx="94" cy="131" r="3" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
  <circle cx="198" cy="92" r="3" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />

  <!-- Active Cell Node at Peak -->
  <g>
    <rect x="292" y="24" width="52" height="22" rx="3" fill="#ffffff" stroke="#15803d" stroke-width="1.5" />
    <text x="318" y="38.5" text-anchor="middle" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="600">IRR 22%</text>
    <rect x="341.5" y="43.5" width="4.5" height="4.5" fill="#15803d" stroke="#ffffff" stroke-width="0.75" />
  </g>
</svg>
